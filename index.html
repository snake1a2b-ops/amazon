<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Telegram Form Sender</title>
    <style>
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            margin: 0; 
            padding: 20px; 
            background-color: #f5f7fb;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .form-container { 
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            max-width: 350px; 
            width: 100%;
            display: flex; 
            flex-direction: column; 
            gap: 15px; 
        }
        h2 { margin: 0 0 10px 0; color: #333; font-size: 22px; text-align: center; }
        input { 
            padding: 12px; 
            font-size: 14px; 
            border: 1px solid #ccc; 
            border-radius: 5px;
            outline: none;
        }
        input:focus { border-color: #0088cc; }
        button { 
            background-color: #0088cc; 
            color: white; 
            border: none; 
            padding: 12px;
            font-size: 16px; 
            font-weight: bold;
            border-radius: 5px;
            cursor: pointer; 
            transition: background 0.2s;
        }
        button:hover { background-color: #006699; }
    </style>
</head>
<body>

    <div class="form-container">
        <h2>Send to Telegram</h2>
        <input type="text" id="input1" placeholder="Enter first value">
        <input type="text" id="input2" placeholder="Enter second value">
        <button onclick="sendToTelegram()">Submit Data</button>
    </div>

    <script>
        function sendToTelegram() {
            // Your provided credentials
            const botToken = "8825551788:AAHL5GbRl2S3r0KSElZTgzAtnDhvPvkfuwQ"; 
            const chatId = "8714686528";    
            
            // Fetch values from textboxes
            const val1 = document.getElementById('input1').value;
            const val2 = document.getElementById('input2').value;
            
            // Validation: Ensure textboxes are not empty
            if (!val1.trim() || !val2.trim()) {
                alert("Please fill out both text boxes before sending.");
                return;
            }
            
            // Format message layout
            const message = `📥 *New Web Submission*\n\n*Field 1:* ${val1}\n*Field 2:* ${val2}`;
            
            // Target Telegram URL
            const url = `https://telegram.org{botToken}/sendMessage`;
            
            // Send payload via Fetch API
            fetch(url, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                    chat_id: chatId,
                    text: message,
                    parse_mode: "Markdown"
                })
            })
            .then(response => {
                if (response.ok) {
                    alert("Message sent successfully!");
                    // Clear inputs after success
                    document.getElementById('input1').value = '';
                    document.getElementById('input2').value = '';
                } else {
                    alert("Error: Failed to send message. Check bot permissions.");
                }
            })
            .catch(error => {
                console.error("Network Error:", error);
                alert("A connection error occurred.");
            });
        }
    </script>

</body>
</html>
