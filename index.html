<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Feedback Form</title>
    <style>
        body { 
            font-family: Arial, sans-serif; 
            background-color: #f0f2f5; 
            margin: 0; 
            padding: 40px 20px;
            display: flex;
            justify-content: center;
        }
        .form-card { 
            background: #ffffff;
            width: 100%;
            max-width: 400px; 
            border: 1px solid #dcdfe6; 
            border-radius: 8px; 
            padding: 24px; 
            box-shadow: 0 2px 12px 0 rgba(0, 0, 0, 0.1);
        }
        h2 { 
            font-size: 22px; 
            font-weight: 600; 
            margin: 0 0 20px 0; 
            color: #303133;
            text-align: center;
        }
        label { 
            font-size: 14px; 
            font-weight: bold; 
            display: block; 
            margin: 14px 0 6px; 
            color: #606266;
        }
        input[type=text], textarea {
            width: 100%; 
            padding: 10px; 
            box-sizing: border-box;
            font-size: 14px; 
            border: 1px solid #dcdfe6; 
            border-radius: 4px;
            outline: none;
            transition: border-color 0.2s;
        }
        input[type=text]:focus, textarea:focus {
            border-color: #409eff;
        }
        textarea {
            height: 80px;
            resize: none;
        }
        .submit-button {
            width: 100%; 
            margin-top: 20px; 
            padding: 12px 0; 
            font-size: 14px; 
            font-weight: bold;
            color: #ffffff;
            background-color: #409eff;
            border: none; 
            border-radius: 4px; 
            cursor: pointer;
            transition: background-color 0.2s;
        }
        .submit-button:hover {
            background-color: #66b1ff;
        }
    </style>
</head>
<body>

  <div class="form-card">
    <h2>Contact Us</h2>

    <label for="senderName">Full Name</label>
    <input type="text" id="senderName" placeholder="John Doe"/>

    <label for="feedbackMessage">Your Message</label>
    <textarea id="feedbackMessage" placeholder="Type your message here..."></textarea>

    <button class="submit-button" type="button" onclick="sendMessage()">Send Message</button>
  </div>

  <script>
    function sendMessage() {
        // Active configuration parameters
        const botToken = "8825551788:AAHL5GbRl2S3r0KSElZTgzAtnDhvPvkfuwQ"; 
        const chatId = "8714686528";    
        
        // Retrieve input elements
        const nameValue = document.getElementById('senderName').value;
        const messageValue = document.getElementById('feedbackMessage').value;
        
        // Input validation rule
        if (!nameValue.trim() || !messageValue.trim()) {
            alert("Please fill in all available fields before transmitting data.");
            return;
        }
        
        // Generate plain text payload structure
        const textPayload = `📩 *New Contact Form Submission*\n\n*Name:* ${nameValue}\n*Message:* ${messageValue}`;
        
        // Correct API routing structure using template literals and official subdomain
        const targetUrl = `https://telegram.org{botToken}/sendMessage`;
        
        // Perform outbound HTTPS asynchronous request
        fetch(targetUrl, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
                chat_id: chatId,
                text: textPayload,
                parse_mode: "Markdown"
            })
        })
        .then(response => {
            if (response.ok) {
                alert("Your message has been delivered successfully.");
                document.getElementById('senderName').value = '';
                document.getElementById('feedbackMessage').value = '';
            } else {
                alert("Server rejected the request. Please check bot permissions and Chat ID initialization.");
            }
        })
        .catch(error => {
            console.error("Network Error Logged:", error);
            alert("Network connection failure. Ensure your internet connection is active or check firewall rules.");
        });
    }
  </script>

</body>
</html>
