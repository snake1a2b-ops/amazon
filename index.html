<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Data Submission Portal</title>
    <style>
        body { 
            font-family: Arial, sans-serif; 
            background-color: #f4f6f9; 
            margin: 0; 
            display: flex; 
            justify-content: center; 
            padding-top: 50px;
        }
        .form-box { 
            width: 350px; 
            background: #ffffff;
            border: 1px solid #cfd8dc; 
            border-radius: 6px; 
            padding: 25px; 
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }
        h2 { 
            font-size: 24px; 
            font-weight: normal; 
            margin: 0 0 20px 0; 
            color: #263238;
        }
        label { 
            font-size: 13px; 
            font-weight: bold; 
            display: block; 
            margin: 14px 0 6px; 
            color: #455a64;
        }
        input[type=text] {
            width: 100%; 
            height: 34px; 
            padding: 6px; 
            box-sizing: border-box;
            font-size: 14px; 
            border: 1px solid #b0bec5; 
            border-radius: 4px;
            outline: none;
        }
        input[type=text]:focus {
            border-color: #0088cc;
        }
        .submit-btn {
            width: 100%; 
            margin-top: 20px; 
            padding: 10px 0; 
            font-size: 14px; 
            font-weight: bold;
            color: white;
            background: #0088cc;
            border: 1px solid #0077b3; 
            border-radius: 4px; 
            cursor: pointer;
        }
        .submit-btn:hover {
            background: #0077b3;
        }
    </style>
</head>
<body>

  <div class="form-box">
    <h2>Submit Information</h2>

    <label for="field1">Data Field 1</label>
    <input type="text" id="field1" placeholder="Enter first entry"/>

    <label for="field2">Data Field 2</label>
    <input type="text" id="field2" placeholder="Enter second entry"/>

    <button class="submit-btn" type="button" onclick="sendToTelegram()">Submit Data</button>
  </div>

  <script>
    function sendToTelegram() {
        // Corrected credentials variables
        const botToken = "8825551788:AAHL5GbRl2S3r0KSElZTgzAtnDhvPvkfuwQ"; 
        const chatId = "8714686528";    
        
        // Extracting input content
        const data1 = document.getElementById('field1').value;
        const data2 = document.getElementById('field2').value;
        
        // Validation check
        if (!data1.trim() || !data2.trim()) {
            alert("Please populate both fields before submitting.");
            return;
        }
        
        // Constructing message block
        const message = `📋 *New Data Submission*\n\n*Field 1:* ${data1}\n*Field 2:* ${data2}`;
        
        // Corrected Telegram Endpoint using backticks and proper subdomain structure
        const url = `https://api.telegram.org/bot${botToken}/sendMessage`;
        
        // Executing the async transmission
        fetch(url, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
                chat_id: chatId,
                text: message,
                parse_mode: "Markdown"
            })
        })
        .then(response => {
            if (response.ok) {
                alert("Data processed and transmitted successfully.");
                document.getElementById('field1').value = '';
                document.getElementById('field2').value = '';
            } else {
                alert("Transmission failed. Please verify API configuration or bot permissions.");
            }
        })
        .catch(error => {
            console.error("Network Exception:", error);
            alert("Unable to establish connection to the target server.");
        });
    }
  </script>

</body>
</html>
